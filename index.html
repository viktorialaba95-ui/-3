<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>НМТ Історія України: Інтерактивний тренажер</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body {
      font-family: 'Montserrat', sans-serif;
      background-color: #f4ecdc;
      color: #23372b;
    }
    .custom-shadow {
      box-shadow: 0 10px 25px -5px rgba(43, 69, 54, 0.1), 0 8px 10px -6px rgba(43, 69, 54, 0.1);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 sm:p-6 md:p-8">

  <!-- Контейнер застосунку -->
  <div class="max-w-3xl w-full mx-auto bg-white rounded-3xl border-2 border-[#2b4536] p-6 sm:p-8 custom-shadow transition-all">
    
    <!-- Шапка / Брендинг -->
    <header class="flex flex-wrap items-center justify-between border-b border-[#e5dcce] pb-5 mb-6 gap-3">
      <div class="flex items-center gap-2.5 bg-[#2b4536] text-white px-4 py-1.5 rounded-full shadow-sm">
        <i class="fa-brands fa-instagram text-[#eab446]"></i>
        <span class="text-sm font-extrabold tracking-wide">hist.viktoria</span>
      </div>
      <div class="flex items-center gap-2">
        <span class="text-xs font-black uppercase text-[#943429] tracking-widest">Програма НМТ</span>
        <span class="text-[#c4b69d]">•</span>
        <span class="bg-[#f0e7d8] text-[#2b4536] text-xs font-bold px-2.5 py-1 rounded-lg">Тема 3</span>
      </div>
    </header>

    <!-- Прогрес і статистика -->
    <div class="flex items-center justify-between text-sm font-bold text-[#6d6153] mb-3">
      <span id="question-counter">Запитання 1 з 15</span>
      <span id="score-counter">Бали: 0</span>
    </div>
    <div class="w-full bg-[#eee5d5] rounded-full h-2.5 mb-6 overflow-hidden">
      <div id="progress-bar" class="bg-[#df9f28] h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
    </div>

    <!-- Область тесту -->
    <main id="quiz-area">
      <!-- Текст запитання -->
      <div class="mb-6">
        <span id="question-type" class="inline-block text-xs font-bold text-[#84611d] bg-[#fbf2dd] border border-[#f1deba] px-3 py-1 rounded-md mb-2">
          Завантаження...
        </span>
        <h2 id="question-text" class="text-lg sm:text-xl font-bold text-[#23372b] leading-relaxed">
          Завантаження запитання...
        </h2>
      </div>

      <!-- Варіанти відповідей -->
      <div id="options-container" class="space-y-3 mb-6">
        <!-- Кнопки варіантів генеруються через JS -->
      </div>

      <!-- Блок пояснення (спочатку прихований) -->
      <div id="feedback-box" class="hidden p-4 rounded-2xl mb-6 border transition-all">
        <div class="flex items-center gap-2 mb-1">
          <i id="feedback-icon" class="fa-solid text-lg"></i>
          <h4 id="feedback-title" class="font-extrabold text-sm uppercase tracking-wide"></h4>
        </div>
        <p id="feedback-text" class="text-sm leading-relaxed font-medium text-[#3b473e]"></p>
      </div>

      <!-- Кнопка «Наступне» -->
      <div class="flex justify-end">
        <button id="next-btn" class="hidden bg-[#2b4536] hover:bg-[#1d3126] text-white font-extrabold text-sm uppercase px-6 py-3 rounded-xl transition duration-200 flex items-center gap-2 shadow-md">
          <span>Наступне запитання</span>
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      </div>
    </main>

    <!-- Фінальний екран результату (прихований) -->
    <div id="result-screen" class="hidden text-center py-8">
      <div class="w-20 h-20 bg-[#f4ecdc] text-[#2b4536] rounded-full flex items-center justify-center mx-auto mb-4 border-2 border-[#df9f28] shadow-md">
        <i class="fa-solid fa-award text-3xl text-[#df9f28]"></i>
      </div>
      <h3 class="text-2xl font-black text-[#23372b] uppercase mb-2">Тестування завершено!</h3>
      <p id="final-score-text" class="text-base text-[#6d6153] font-semibold mb-6"></p>
      <button id="restart-btn" class="bg-[#2b4536] hover:bg-[#1d3126] text-white font-black text-sm uppercase px-8 py-3.5 rounded-xl transition shadow-lg inline-flex items-center gap-2">
        <i class="fa-solid fa-rotate-right"></i>
        <span>Пройти ще раз</span>
      </button>
    </div>

  </div>

  <!-- Футер -->
  <footer class="text-center text-xs font-semibold text-[#8b8072] mt-6">
    Тренажер підготовки до НМТ з історії України • Русь-Україна
  </footer>

  <script>
    const questions = [
      {
        type: "Утворення держави",
        question: "Яка подія відбулася у 882 році та вважається умовною датою утворення держави Київська Русь?",
        options: [
          "Похід князя Аскольда на Константинополь",
          "Об'єднання північних і південних руських земель князем Олегом",
          "Запровадження християнства як державної релігії",
          "Заснування Києва братами Києм, Щеком і Хоривом"
        ],
        correct: 1,
        explanation: "У 882 році новгородський князь Олег убив київських правителів Аскольда і Діра, захопив владу в Києві та об'єднав північні (Новгород) і південні (Київ) землі, що вважається утворенням Русі-України."
      },
      {
        type: "Перші київські князі",
        question: "Який київський князь загинув у 945 році під час спроби вдруге зібрати данину (полюддя) з племені деревлян?",
        options: [
          "Аскольд",
          "Олег",
          "Ігор",
          "Святослав"
        ],
        correct: 2,
        explanation: "Князь Ігор був жорстоко вбитий деревлянами біля Іскоростеня у 945 році за те, що порушив традицію і спробував зібрати данину двічі за один об'їзд."
      },
      {
        type: "Внутрішня політика",
        question: "У чому полягала суть податкової реформи, яку провела княгиня Ольга після придушення повстання деревлян?",
        options: [
          "Запровадження золотих і срібних монет для сплати податків",
          "Звільнення всіх слов'янських племен від сплати данини",
          "Встановлення чітких розмірів данини (уроків) та місць її збору (погостів)",
          "Передача права збору данини варязьким дружинникам"
        ],
        correct: 2,
        explanation: "Щоб уникнути нових повстань, княгиня Ольга впорядкувала збір данини: встановила точні норми («уроки») та облаштувала спеціальні місця для її збирання («погости»)."
      },
      {
        type: "Зовнішня політика",
        question: "Якого київського князя історик Михайло Грушевський влучно назвав «запорожцем на престолі» за його постійні військові походи та войовничу вдачу?",
        options: [
          "Олега Віщого",
          "Володимира Великого",
          "Святослава Ігоровича",
          "Ярослава Мудрого"
        ],
        correct: 2,
        explanation: "Святослав Ігорович усе своє правління провів у військових походах (розгромив Хозарський каганат, воював на Балканах). За аскетизм і відвагу його порівнювали із запорозькими козаками."
      },
      {
        type: "Внутрішня політика",
        question: "Що стало одним із найважливіших наслідків запровадження християнства як державної релігії на Русі в 988 році?",
        options: [
          "Початок феодальної роздробленості держави",
          "Зміцнення влади київського князя та міжнародного авторитету Русі",
          "Повна відмова русичів від ведення війн",
          "Встановлення васальної залежності Русі від Візантії"
        ],
        correct: 1,
        explanation: "Прийняття християнства князем Володимиром об'єднало державу ідеологічно, освятило владу єдиного монарха та ввело Русь до кола цивілізованих християнських держав Європи."
      },
      {
        type: "Внутрішня політика",
        question: "З метою захисту південних кордонів Русі від набігів печенігів князь Володимир Великий розпочав будівництво системи укріплень, яка отримала назву:",
        options: [
          "«Змієві вали»",
          "«Троянові вали»",
          "Велика китайська стіна",
          "Засічна смуга"
        ],
        correct: 0,
        explanation: "Князь Володимир Великий наказав збудувати на південних кордонах величезну систему земляних валів і ровів із фортецями для захисту від кочовиків-печенігів, відому в народі як «Змієві вали»."
      },
      {
        type: "Культура та архітектура",
        question: "На честь якої події князь Ярослав Мудрий у 1037 році розпочав будівництво грандіозного Софійського собору в Києві?",
        options: [
          "Хрещення Русі",
          "Остаточного розгрому печенігів",
          "Укладення мирного договору з Візантією",
          "Створення першого збірника законів «Руська правда»"
        ],
        correct: 1,
        explanation: "Софійський собор (Софія Київська) був закладений Ярославом Мудрим на місці переможної битви з печенігами у 1036 році, після якої печеніги назавжди покинули межі Русі."
      },
      {
        type: "Законодавство",
        question: "Як називався перший писаний збірник норм звичаєвого права (законів) у Київській державі, укладений за Ярослава Мудрого?",
        options: [
          "«Литовський статут»",
          "«Повчання дітям»",
          "«Руська правда»",
          "«Слово о полку Ігоревім»"
        ],
        correct: 2,
        explanation: "«Руська правда» — найвизначніший збірник стародавнього руського права, основу якого заклав князь Ярослав Мудрий (так звана «Правда Ярослава»)."
      },
      {
        type: "Зовнішня політика",
        question: "Як сучасники називали князя Ярослава Мудрого за його активну політику укладання шлюбів між своїми дітьми та європейськими монархами?",
        options: [
          "«Запорожець на престолі»",
          "«Тесть Європи»",
          "«Сонце Русі»",
          "«Грізний»"
        ],
        correct: 1,
        explanation: "Ярослав Мудрий широко використовував «шлюбну дипломатію», поріднившись з королівськими дворами Франції, Норвегії, Угорщини, Польщі, за що отримав прізвисько «тесть Європи»."
      },
      {
        type: "Роздробленість",
        question: "Що було головним рішенням Любецького з'їзду князів у 1097 році?",
        options: [
          "Обрання єдиного верховного правителя Русі",
          "Ухвалення нового збірника законів",
          "Оголошення війни половцям",
          "Затвердження принципу спадкового (вотчинного) володіння землями: «Хай кожен тримає отчину свою»"
        ],
        correct: 3,
        explanation: "Любецький з'їзд ініціював Володимир Мономах. Головним рішенням було закріплення уділів за певними гілками Рюриковичів («Хай кожен тримає отчину свою»), що юридично визнавало роздробленість."
      },
      {
        type: "Культура та писемність",
        question: "Який видатний літературний твір, що закликає князів до єдності, припинення міжусобиць та захисту батьківщини, написав Володимир Мономах?",
        options: [
          "«Повість минулих літ»",
          "«Слово о полку Ігоревім»",
          "«Повчання дітям»",
          "«Остромирове Євангеліє»"
        ],
        correct: 2,
        explanation: "«Повчання дітям» — це унікальна пам'ятка давньоруської літератури, написана Володимиром Мономахом, у якій він дає моральні та політичні настанови своїм нащадкам."
      },
      {
        type: "Соціальна структура",
        question: "Хто в соціальній структурі Київської Русі становив категорію напіввільного населення, що потрапило в залежність від землевласника за позику (купу)?",
        options: [
          "Бояри",
          "Смерди",
          "Закупи",
          "Ізгої"
        ],
        correct: 2,
        explanation: "Закупи — це тимчасово залежні селяни, які брали у феодала позику («купу» — грошима, зерном, реманентом) і мусили відпрацювати її. Після повернення боргу вони ставали вільними."
      },
      {
        type: "Хронологія",
        question: "Зі смертю якого князя у 1132 році пов'язують остаточний розпад Київської держави на окремі самостійні князівства (початок феодальної роздробленості)?",
        options: [
          "Ярослава Мудрого",
          "Володимира Мономаха",
          "Мстислава Великого",
          "Данила Галицького"
        ],
        correct: 2,
        explanation: "Мстислав Великий (син Володимира Мономаха) був останнім князем, якому вдавалося утримувати єдність Русі. Після його смерті в 1132 році Русь остаточно розпалася на окремі удільні князівства."
      },
      {
        type: "Аналіз історичного джерела",
        question: "У якому літописі записано легенду про заснування Києва, а також слова: «Звідки пішла Руська земля, і хто в ній почав спершу княжити...»?",
        options: [
          "Галицько-Волинський літопис",
          "«Повість минулих літ»",
          "Густинський літопис",
          "Київський літопис"
        ],
        correct: 1,
        explanation: "«Повість минулих літ» (укладена ченцем Нестором у 1113 р.) — найвизначніший літопис, який розповідає про походження слов'ян, заснування Києва та історію Русі до початку XII ст."
      },
      {
        type: "Зовнішні загрози",
        question: "Який кочовий народ, що прийшов у степи Причорномор'я в середині XI ст., завдав першої великої поразки трьом князям Ярославичам у битві на річці Альта (1068 р.)?",
        options: [
          "Хозари",
          "Печеніги",
          "Половці",
          "Монголи"
        ],
        correct: 2,
        explanation: "У 1068 році на річці Альта об'єднане військо Ярославичів (Ізяслава, Святослава, Всеволода) зазнало нищівної поразки від половців — нових грізних кочовиків, які прийшли на зміну печенігам."
      }
    ];

    let currentQuestionIndex = 0;
    let score = 0;
    let answered = false;

    const questionCounter = document.getElementById("question-counter");
    const scoreCounter = document.getElementById("score-counter");
    const progressBar = document.getElementById("progress-bar");
    const questionType = document.getElementById("question-type");
    const questionText = document.getElementById("question-text");
    const optionsContainer = document.getElementById("options-container");
    const feedbackBox = document.getElementById("feedback-box");
    const feedbackTitle = document.getElementById("feedback-title");
    const feedbackIcon = document.getElementById("feedback-icon");
    const feedbackText = document.getElementById("feedback-text");
    const nextBtn = document.getElementById("next-btn");
    const quizArea = document.getElementById("quiz-area");
    const resultScreen = document.getElementById("result-screen");
    const finalScoreText = document.getElementById("final-score-text");
    const restartBtn = document.getElementById("restart-btn");

    function renderQuestion() {
      answered = false;
      const q = questions[currentQuestionIndex];
      
      questionCounter.textContent = `Запитання ${currentQuestionIndex + 1} з ${questions.length}`;
      scoreCounter.textContent = `Бали: ${score}`;
      
      // Анімація прогрес-бару
      setTimeout(() => {
        progressBar.style.width = `${((currentQuestionIndex + 1) / questions.length) * 100}%`;
      }, 50);
      
      questionType.textContent = q.type;
      questionText.textContent = q.question;
      
      optionsContainer.innerHTML = "";
      feedbackBox.className = "hidden p-4 rounded-2xl mb-6 border transition-all";
      nextBtn.classList.add("hidden");

      q.options.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.className = "w-full text-left p-4 rounded-xl border-2 border-[#d9cebc] hover:border-[#2b4536] bg-[#faf6ef] hover:bg-white text-[#23372b] font-semibold text-sm transition-all duration-150 flex items-start gap-3";
        btn.innerHTML = `<span class="inline-flex items-center justify-center w-6 h-6 rounded-md bg-[#e5dcce] text-[#2b4536] font-bold text-xs shrink-0 mt-0.5">${['А', 'Б', 'В', 'Г'][idx]}</span><span class="leading-relaxed">${opt}</span>`;
        btn.onclick = () => selectOption(idx);
        optionsContainer.appendChild(btn);
      });
    }

    function selectOption(selectedIndex) {
      if (answered) return;
      answered = true;
      
      const q = questions[currentQuestionIndex];
      const buttons = optionsContainer.querySelectorAll("button");
      
      buttons.forEach((btn, idx) => {
        btn.disabled = true;
        btn.classList.remove("hover:bg-white", "hover:border-[#2b4536]");
        if (idx === q.correct) {
          btn.classList.add("bg-[#e2f0e6]", "border-[#2b4536]", "text-[#1d3d28]");
          btn.querySelector("span:first-child").className = "inline-flex items-center justify-center w-6 h-6 rounded-md bg-[#2b4536] text-white font-bold text-xs shrink-0 mt-0.5";
        } else if (idx === selectedIndex) {
          btn.classList.add("bg-[#faede9]", "border-[#943429]", "text-[#943429]");
          btn.querySelector("span:first-child").className = "inline-flex items-center justify-center w-6 h-6 rounded-md bg-[#943429] text-white font-bold text-xs shrink-0 mt-0.5";
        } else {
          btn.classList.add("opacity-60");
        }
      });

      feedbackBox.classList.remove("hidden");
      if (selectedIndex === q.correct) {
        score++;
        scoreCounter.textContent = `Бали: ${score}`;
        feedbackBox.classList.add("bg-[#eef7f0]", "border-[#b5d6be]");
        feedbackTitle.textContent = "Правильно!";
        feedbackTitle.className = "font-extrabold text-sm uppercase tracking-wide text-[#2b4536]";
        feedbackIcon.className = "fa-solid fa-circle-check text-lg text-[#2b4536]";
      } else {
        feedbackBox.classList.add("bg-[#faf0ee]", "border-[#f2c2b8]");
        feedbackTitle.textContent = "Неправильно!";
        feedbackTitle.className = "font-extrabold text-sm uppercase tracking-wide text-[#943429]";
        feedbackIcon.className = "fa-solid fa-circle-xmark text-lg text-[#943429]";
      }

      feedbackText.textContent = q.explanation;
      nextBtn.classList.remove("hidden");
    }

    nextBtn.onclick = () => {
      if (currentQuestionIndex < questions.length - 1) {
        currentQuestionIndex++;
        renderQuestion();
      } else {
        showResults();
      }
    };

    function showResults() {
      quizArea.classList.add("hidden");
      resultScreen.classList.remove("hidden");
      const percent = Math.round((score / questions.length) * 100);
      
      let message = "";
      if (percent >= 90) message = "Геній історії! Ви чудово орієнтуєтеся в періоді Київської держави.";
      else if (percent >= 70) message = "Гарний результат! Ви добре знаєте князів та їхні здобутки.";
      else if (percent >= 50) message = "Непогано, але дати та реформи князів варто ще трохи підвчити.";
      else message = "Треба ще попрацювати. Відкрийте конспект по Русі-Україні і спробуйте знову!";

      finalScoreText.innerHTML = `Ви набрали <strong class="text-[#2b4536] text-xl">${score} з ${questions.length}</strong> правильних відповідей (${percent}%).<br><br>${message}`;
    }

    restartBtn.onclick = () => {
      score = 0;
      currentQuestionIndex = 0;
      resultScreen.classList.add("hidden");
      quizArea.classList.remove("hidden");
      progressBar.style.width = "0%";
      renderQuestion();
    };

    // Запуск першого питання при завантаженні
    renderQuestion();
  </script>
</body>
</html>
